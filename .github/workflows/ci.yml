name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: test -z "$(gofmt -l cmd internal tests/load)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: bash tests/supervisor.sh
      - run: python3 tests/integration-patch.py
      - run: python3 tests/soak-report-audit-checks.py
      - run: python3 tests/vendor-aged-preflight-checks.py
      - run: python3 tests/vendor-aged-postflight-checks.py
      - run: python3 tests/vendor-enforce-stage-checks.py
      - run: bash scripts/build.sh "${GITHUB_REF_NAME//\//-}"
      - run: python3 scripts/package.py "${GITHUB_REF_NAME//\//-}"
      - run: python3 scripts/check-package.py "${GITHUB_REF_NAME//\//-}"
      - run: python3 tests/release-integrity.py "${GITHUB_REF_NAME//\//-}"
      - run: python3 scripts/check-reproducible.py "${GITHUB_REF_NAME//\//-}"
      - run: ./dist/crg-linux-amd64 build-info > dist/build-info.json
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Attest amd64 SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/crg-linux-amd64
          sbom-path: dist/sbom-linux-amd64.cdx.json
      - name: Attest arm64 SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/crg-linux-arm64
          sbom-path: dist/sbom-linux-arm64.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crg-linux
          path: dist/
