name: linux6-cgroup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify actual Linux6 environment before any fixture
        run: |
          mkdir -p ci-linux6-cgroup
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          result = {'source_revision':os.environ['GITHUB_SHA'],'runner_label':'${{ matrix.runner }}','architecture':'${{ matrix.arch }}','machine':platform.machine(),'kernel':platform.release(),'cgroup_filesystem':subprocess.check_output(['stat','-fc','%T','/sys/fs/cgroup'],text=True).strip(),'docker_version':json.loads(subprocess.check_output(['docker','version','--format','{{json .}}'],text=True)),'scope':'ephemeral native VM compatibility probe; not vendor business'}
          result['Linux6_kernel_gate_passed'] = result['kernel'].startswith('6.')
          pathlib.Path('ci-linux6-cgroup/environment.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['Linux6_kernel_gate_passed'], 'actual kernel is not Linux6; no controller fixture started'
          assert result['cgroup_filesystem'] == 'cgroup2fs'
          PY
      - name: Linux6 native vet and race checks
        run: |
          go vet ./...
          go test -race -count=1 -json ./... > ci-linux6-cgroup/go-test-race.jsonl
      - name: Build exact native test programs
        run: |
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
          test "$(go env GOVERSION)" = 'go1.27.3'
          mkdir -p ci-linux6-cgroup
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=native-controller-ci -X main.revision=$GITHUB_SHA" -o ci-linux6-cgroup/crg ./cmd/crg
          CGO_ENABLED=0 go build -trimpath -o ci-linux6-cgroup/hold ./tests/native-holder
          CGO_ENABLED=0 go build -trimpath -o ci-linux6-cgroup/load ./tests/load
          ./ci-linux6-cgroup/crg build-info > ci-linux6-cgroup/build-info.json
      - name: Actual own-container controls and recovery
        run: |
          sudo env CRG_NATIVE_CGROUP_TEST=ephemeral-github-vm-only python3 tests/native-cgroup.py \
            --binary "$PWD/ci-linux6-cgroup/crg" --holder "$PWD/ci-linux6-cgroup/hold" \
            --load "$PWD/ci-linux6-cgroup/load" --output "$PWD/ci-linux6-cgroup/results" \
            --expected-arch '${{ matrix.arch }}' --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux6-cgroup-${{ matrix.arch }}-${{ github.sha }}
          path: ci-linux6-cgroup/
          retention-days: 14
